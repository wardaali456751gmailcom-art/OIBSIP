<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plate | Healthy Food Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(
                90deg,
                #536457 0%,
                #536457 27%,
                #3d403f 27%,
                #3d403f 69%,
                #35d12f 69%,
                #35d12f 100%
            );
        }

        /* Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 3px;
            color: white;
        }

        .logo span {
            color: #43df3d;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        nav a:hover {
            color: #43df3d;
        }

        .social a {
            display: inline-block;
            margin-left: 7px;
            text-decoration: none;
            color: white;
            background: #2467c9;
            border-radius: 50%;
            padding: 6px 9px;
            font-weight: bold;
        }

        /* Main Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 65px 8%;
        }

        .text {
            width: 55%;
            z-index: 1;
        }

        h1 {
            font-size: clamp(45px, 6vw, 85px);
            line-height: 1.2;
            margin-bottom: 25px;
        }

        h1 span {
            color: #43df3d;
        }

        .text p {
            font-size: 17px;
            line-height: 1.7;
            max-width: 420px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #40d637;
            color: white;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 3px;
            font-weight: bold;
        }

        .btn:hover {
            background: #279f22;
        }

        /* Food Image */
        .food-box {
            width: 42%;
            display: flex;
            justify-content: center;
        }

        .food-box img {
            width: min(34vw, 410px);
            height: min(34vw, 410px);
            object-fit: cover;
            border-radius: 50%;
            border: 9px solid white;
            box-shadow: 0 15px 35px #0004;
        }

        /* Bottom Heading */
        .caption {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 38px;
            letter-spacing: 3px;
            margin: 5px auto 25px;
        }

        .caption p {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 5px;
            margin-top: 15px;
        }

        /* Mobile Responsive */
        @media (max-width: 760px) {
            .container {
                background: linear-gradient(
                    90deg, #536457 50%, #35d12f 50%
                );
            }

            header {
                flex-wrap: wrap;
                gap: 18px;
                padding: 20px 6%;
            }

            .logo {
                font-size: 32px;
            }

            nav {
                width: 100%;
                flex-wrap: wrap;
                gap: 15px;
            }

            nav a {
                font-size: 13px;
            }

            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 40px;
                padding: 45px 7%;
            }

            .text, .food-box {
                width: 100%;
            }

            h1 {
                font-size: 48px;
            }

            .food-box img {
                width: min(70vw, 320px);
                height: min(70vw, 320px);
            }

            .caption {
                font-size: 25px;
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="home">

        <!-- Header -->
        <header>
            <div class="logo">P<span>late</span></div>

            <nav>
                <a href="#home">Home</a>
                <a href="#order">Order</a>
                <a href="#reviews">Testimonials</a>
                <a href="#contact">Contact</a>
            </nav>

            <div class="social">
                <a href="#contact">f</a>
                <a href="#contact">t</a>
                <a href="#contact">◎</a>
            </div>
        </header>

        <!-- Main Content -->
        <section class="hero">

            <div class="text">
                <h1>
                    <span>S</span>tay fit<br>
                    <span>E</span>at healthy
                </h1>

                <p>
                    Fresh ingredients, colorful meals,
                    and delicious choices to help you
                    feel your best every day.
                </p>

                <a href="#contact" class="btn" id="order">
                    Order now
                </a>
            </div>

            <div class="food-box">
                <img
                    src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=900&q=85"
                    alt="Healthy fresh food salad"
                >
            </div>

        </section>

        <!-- Bottom Section -->
        <div class="caption" id="reviews">
            FOOD WEBSITE
            <p>FRESH • HEALTHY • DELICIOUS</p>
        </div>

        <footer id="contact"></footer>

    </div>

</body>
</html>
